<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Réinitialiser le mot de passe — MyApp</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <link th:href="@{/css/login.css}" rel="stylesheet">
</head>
<body>
  <main>
    <form class="card" th:action="@{/forgot-password}" th:object="${forgotPasswordRequest}" method="post" novalidate>
      <h2 style="margin:0 0 8px">Mot de passe oublié</h2>

      <!-- CSRF -->
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <!-- Messages -->
      <div th:if="${error}" class="error-inline" role="alert" th:text="${error}"></div>
      <div th:if="${param.passwordChanged}" class="muted">Mot de passe modifié avec succès — connectez-vous.</div>

      <label for="email">Email</label>
      <input id="email" type="email" th:field="*{email}" placeholder="utilisateur@exemple.com" required autocomplete="email" />

      <label for="newPassword" style="margin-top:10px">Nouveau mot de passe</label>
      <input id="newPassword" type="password" th:field="*{newPassword}" placeholder="Nouveau mot de passe" required autocomplete="new-password" />

      <label for="confirmPassword" style="margin-top:10px">Confirmer mot de passe</label>
      <input id="confirmPassword" type="password" th:field="*{confirmPassword}" placeholder="Confirmer mot de passe" required autocomplete="new-password" />

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
        <button type="submit" class="btn" id="submitBtn">Changer mot de passe</button>
      </div>

      <div class="muted" style="margin-top:10px">
        Retour à la <a th:href="@{/login}" style="color:#bff0e9;text-decoration:underline">connexion</a>
      </div>
    </form>
  </main>

  <script th:src="@{/js/login.js}" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function(){
      const form = document.querySelector('form.card');
      const submitBtn = document.getElementById('submitBtn');
      form.addEventListener('submit', function(e){
        const email = document.getElementById('email').value.trim();
        const pw = document.getElementById('newPassword').value;
        const cpw = document.getElementById('confirmPassword').value;
        if(!email || !pw || !cpw){ e.preventDefault(); alert('Tous les champs sont requis'); return; }
        if(pw !== cpw){ e.preventDefault(); alert('Les mots de passe ne correspondent pas'); return; }
        submitBtn.disabled = true;
        submitBtn.textContent = 'Veuillez patienter...';
      });
    });
  </script>
</body>
</html>
