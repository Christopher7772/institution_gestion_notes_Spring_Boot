<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>S'inscrire — MyApp</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <link th:href="@{/css/login.css}" rel="stylesheet">
</head>
<body>
  <main>
    <form class="card" th:action="@{/register}" th:object="${registerRequest}" method="post" novalidate>
      <h2 style="margin:0 0 8px">Créer un compte</h2>

      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <div th:if="${error}" class="error-inline" style="color: #ff6b6b; font-size: 0.9em; margin-bottom: 10px;" role="alert" th:text="${error}"></div>
      <div th:if="${param.registered}" class="muted">Inscription réussie — connectez-vous.</div>

      <label for="role">Je suis un(e) :</label>
      <select id="role" th:field="*{role}" required style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ddd; background: #fff; font-family: 'Inter';">
        <option value="" disabled selected>Choisir mon statut</option>
        <option value="STUDENT">Étudiant</option>
        <option value="TEACHER">Enseignant</option>
        <option value="ADMIN">Administrateur</option>
      </select>

      <div style="display: flex; gap: 10px;">
        <div style="flex: 1;">
          <label for="nom">Nom</label>
          <input id="nom" type="text" th:field="*{nom}" placeholder="Nom" required />
        </div>
        <div style="flex: 1;">
          <label for="prenom">Prénom</label>
          <input id="prenom" type="text" th:field="*{prenom}" placeholder="Prénom" required />
        </div>
      </div>
      <p class="muted" style="font-size: 0.75em; margin-top: 4px;">Utilisez les noms fournis lors de votre admission.</p>

      <label for="email" style="margin-top:10px">Email de connexion</label>
      <input id="email" type="email" th:field="*{email}" placeholder="utilisateur@exemple.com" required autocomplete="email" />

      <label for="password" style="margin-top:10px">Mot de passe</label>
      <input id="password" type="password" th:field="*{password}" placeholder="••••••••" required autocomplete="new-password" />

      <label for="confirmPassword" style="margin-top:10px">Confirmer mot de passe</label>
      <input id="confirmPassword" type="password" th:field="*{confirmPassword}" placeholder="••••••••" required autocomplete="new-password" />

      <button type="submit" class="btn" id="submitBtn">S'inscrire</button>

      <div class="muted" style="margin-top:10px">
        Déjà inscrit ? <a th:href="@{/login}" style="color:#bff0e9;text-decoration:underline">Se connecter</a>
      </div>
    </form>
  </main>

  <script th:src="@{/js/login.js}" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function(){
      const form = document.querySelector('form.card');
      const submitBtn = document.getElementById('submitBtn');
      
      form.addEventListener('submit', function(e){
        const role = document.getElementById('role').value;
        const nom = document.getElementById('nom').value.trim();
        const prenom = document.getElementById('prenom').value.trim();
        const email = document.getElementById('email').value.trim();
        const pw = document.getElementById('password').value;
        const cpw = document.getElementById('confirmPassword').value;

        if(!role || !nom || !prenom || !email || !pw || !cpw){ 
            e.preventDefault(); 
            alert('Tous les champs sont requis pour vérifier votre identité.'); 
            return; 
        }
        
        if(pw !== cpw){ 
            e.preventDefault(); 
            alert('Les mots de passe ne correspondent pas'); 
            return; 
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Vérification...';
      });
    });
  </script>
</body>
</html>
