<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Admin — Gestion des Professeurs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet"/>

    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>

    <aside class="sidebar d-flex flex-column" id="sidebar">
        <div class="p-4 border-bottom border-secondary mb-3">
            <h4 class="mb-0 fw-bold"><i class="bi bi-shield-check"></i> MyApp <span class="text-primary text-sm">Admin</span></h4>
        </div>
        <ul class="nav flex-column mb-auto">
            <li><a th:href="@{/admin/dashboard}" class="nav-link"><i class="bi bi-grid-fill"></i> Tableau de bord</a></li>
            <li><a th:href="@{/admin/etudiants}" class="nav-link"><i class="bi bi-people"></i> Étudiants</a></li>
            <li><a th:href="@{/admin/professeurs}" class="nav-link active"><i class="bi bi-person-badge"></i> Professeurs</a></li>
            <li><a th:href="@{/admin/matieres}" class="nav-link"><i class="bi bi-book"></i> Matières</a></li>
        </ul>
        
        <div class="p-3 border-top border-secondary">
            <form th:action="@{/logout}" method="post" class="m-0">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-outline-danger btn-sm w-100">
                    <i class="bi bi-box-arrow-left"></i> Déconnexion
                </button>
            </form>
        </div>
    </aside>

    <div class="main-wrapper">
        <nav class="top-navbar d-flex align-items-center px-4 justify-content-between">
            <button class="btn btn-sm btn-light d-lg-none" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
            <div class="ms-auto d-flex align-items-center">
                <span class="me-3 text-muted">Bonjour, <strong th:text="${username}">Admin</strong></span>
            </div>
        </nav>

        <div class="container-fluid p-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
                <h1 class="h2">Gestion des Professeurs</h1>
            </div>

            <div class="card mb-4 border-0 shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 fw-bold text-primary" id="formTitle"><i class="bi bi-person-plus-fill"></i> Nouveau Professeur</h5>
                </div>
                <div class="card-body">
                    <form id="createProfForm" class="row g-3">
                        <input type="hidden" id="editIdProfesseur">
                        <div class="col-md-6">
                            <label for="nom" class="form-label">Nom</label>
                            <input type="text" class="form-control" id="nom" required>
                        </div>
                        <div class="col-md-6">
                            <label for="prenom" class="form-label">Prénom</label>
                            <input type="text" class="form-control" id="prenom" required>
                        </div>
                        <div class="col-md-4">
                            <label for="specialite" class="form-label">Spécialité / Département</label>
                            <input type="text" class="form-control" id="specialite">
                        </div>
                        <div class="col-md-4">
                            <label for="email" class="form-label">Email professionnel</label>
                            <input type="email" class="form-control" id="email">
                        </div>
                        <div class="col-md-4">
                            <label for="numero" class="form-label">Numéro Professeur</label>
                            <input type="text" class="form-control" id="numero">
                        </div>
                        <div class="col-12 text-end">
                            <button type="button" class="btn btn-light d-none" id="cancelBtn" onclick="resetForm()">Annuler</button>
                            <button type="submit" class="btn btn-primary" id="submitBtn">
                                <i class="bi bi-save"></i> Enregistrer
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div id="alertContainer"></div>

            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 fw-bold text-primary">Effectif Enseignant</h5>
                    <span class="badge bg-light text-dark border" th:text="${#lists.size(professeurs) + ' total'}">0</span>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>Professeur</th>
                                <th>Spécialité</th>
                                <th>Email</th>
                                <th>Numéro</th>
                                <th class="text-end pe-4">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="profTableBody">
                            <tr th:each="p : ${professeurs}" th:id="'row-' + ${p.idProfesseur}">
                                <td class="ps-4 text-muted fw-bold" th:text="${p.idProfesseur}">1</td>
                                <td>
                                    <div class="d-flex align-items-center">
                                        <div class="avatar-sm bg-light text-primary rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 35px; height: 35px; border: 1px solid #e0e0e0;">
                                            <i class="bi bi-person"></i>
                                        </div>
                                        <div class="prof-name" th:text="${p.nom + ' ' + p.prenom}">Nom Prénom</div>
                                    </div>
                                </td>
                                <td><span class="badge bg-light text-dark border prof-specialite" th:text="${p.specialite}">Maths</span></td>
                                <td class="small prof-email" th:text="${p.email}">email@ecole.com</td>
                                <td class="prof-numero" th:text="${p.numeroProfesseur}">P001</td>
                                <td class="text-end pe-4">
                                    <button class="btn btn-sm btn-outline-secondary" th:onclick="'prepareEdit(' + ${p.idProfesseur} + ', this)'">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger" th:onclick="'deleteProf(' + ${p.idProfesseur} + ', this)'">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('show');
        }

        const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');
        
        const form = document.getElementById('createProfForm');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const alertContainer = document.getElementById('alertContainer');
        const tableBody = document.getElementById('profTableBody');
        const editIdInput = document.getElementById('editIdProfesseur');

        function showAlert(message, type) {
            const wrapper = document.createElement('div');
            wrapper.innerHTML = [
                `<div class="alert alert-${type} alert-dismissible fade show" role="alert">`,
                `   <div>${message}</div>`,
                '   <button type="button" class="btn-close" data-bs-alert="alert" aria-label="Close" onclick="this.parentElement.remove()"></button>',
                '</div>'
            ].join('');
            alertContainer.innerHTML = '';
            alertContainer.append(wrapper);
        }

        // --- GESTION ENREGISTREMENT (POST & PUT) ---
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const id = editIdInput.value;
            const isEdit = id !== "";

            submitBtn.disabled = true;
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Envoi...';

            const payload = {
                nom: document.getElementById('nom').value,
                prenom: document.getElementById('prenom').value,
                specialite: document.getElementById('specialite').value,
                email: document.getElementById('email').value,
                numeroProfesseur: document.getElementById('numero').value
            };

            try {
                const url = isEdit ? `/api/admin/professeurs/${id}` : '/api/admin/professeurs';
                const method = isEdit ? 'PUT' : 'POST';

                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error('Erreur lors de l\'enregistrement');
                
                const data = await res.json();
                
                if(isEdit) {
                    showAlert(`Professeur <strong>${data.nom}</strong> mis à jour !`, 'success');
                    setTimeout(() => location.reload(), 1000);
                } else {
                    showAlert(`Professeur <strong>${data.nom}</strong> ajouté avec succès !`, 'success');
                    form.reset();
                    
                    const newRow = `
                        <tr class="table-success" id="row-${data.idProfesseur}">
                            <td class="ps-4 text-muted fw-bold">${data.idProfesseur}</td>
                            <td>
                                <div class="d-flex align-items-center">
                                    <div class="avatar-sm bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 35px; height: 35px;">
                                        <i class="bi bi-person"></i>
                                    </div>
                                    <div class="prof-name">${data.nom} ${data.prenom}</div>
                                </div>
                            </td>
                            <td><span class="badge bg-light text-dark border prof-specialite">${data.specialite || '-'}</span></td>
                            <td class="small prof-email">${data.email || '-'}</td>
                            <td class="prof-numero">${data.numeroProfesseur || '-'}</td>
                            <td class="text-end pe-4">
                                <button class="btn btn-sm btn-outline-secondary" onclick="prepareEdit(${data.idProfesseur}, this)"><i class="bi bi-pencil"></i></button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteProf(${data.idProfesseur}, this)"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>`;
                    
                    tableBody.insertAdjacentHTML('afterbegin', newRow);
                    setTimeout(() => {
                        const row = document.getElementById(`row-${data.idProfesseur}`);
                        if(row) row.classList.remove('table-success');
                    }, 2000);
                }

            } catch (err) {
                showAlert(err.message, 'danger');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnText;
            }
        });

        // --- PREPARATION MODIFICATION ---
        function prepareEdit(id, btn) {
            const row = btn.closest('tr');
            const fullName = row.querySelector('.prof-name').innerText.split(' ');
            
            editIdInput.value = id;
            document.getElementById('nom').value = fullName[0];
            document.getElementById('prenom').value = fullName.slice(1).join(' ');
            document.getElementById('specialite').value = row.querySelector('.prof-specialite').innerText;
            document.getElementById('email').value = row.querySelector('.prof-email').innerText;
            document.getElementById('numero').value = row.querySelector('.prof-numero').innerText;

            document.getElementById('formTitle').innerHTML = '<i class="bi bi-pencil-square"></i> Modifier Professeur';
            submitBtn.innerHTML = '<i class="bi bi-check-lg"></i> Mettre à jour';
            submitBtn.classList.replace('btn-primary', 'btn-warning');
            cancelBtn.classList.remove('d-none');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- RESET FORMULAIRE ---
        function resetForm() {
            form.reset();
            editIdInput.value = "";
            document.getElementById('formTitle').innerHTML = '<i class="bi bi-person-plus-fill"></i> Nouveau Professeur';
            submitBtn.innerHTML = '<i class="bi bi-save"></i> Enregistrer';
            submitBtn.classList.replace('btn-warning', 'btn-primary');
            cancelBtn.classList.add('d-none');
        }

        // --- SUPPRESSION ---
        async function deleteProf(id, btn) {
            if(!confirm("Voulez-vous vraiment supprimer ce professeur ?")) return;
            
            try {
                const res = await fetch(`/api/admin/professeurs/${id}`, {
                    method: 'DELETE',
                    headers: { [csrfHeader]: csrfToken }
                });
                if(!res.ok) throw new Error("Erreur lors de la suppression");
                
                btn.closest('tr').remove();
                showAlert("Professeur supprimé de la base.", "info");
            } catch (err) {
                showAlert(err.message, "danger");
            }
        }
    </script>
</body>
</html>
