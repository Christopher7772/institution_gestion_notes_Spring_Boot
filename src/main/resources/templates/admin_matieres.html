<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Admin — Gestion des Matières</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link th:href="@{/css/dashboard.css}" rel="stylesheet"/>
</head>
<body>

    <aside class="sidebar d-flex flex-column" id="sidebar">
        <div class="p-4 border-bottom border-secondary mb-3">
            <h4 class="mb-0 fw-bold"><i class="bi bi-shield-check"></i> MyApp</h4>
        </div>
        <ul class="nav flex-column mb-auto">
            <li><a th:href="@{/admin/dashboard}" class="nav-link"><i class="bi bi-grid-fill"></i> Tableau de bord</a></li>
            <li><a th:href="@{/admin/etudiants}" class="nav-link"><i class="bi bi-people"></i> Étudiants</a></li>
            <li><a th:href="@{/admin/professeurs}" class="nav-link"><i class="bi bi-person-badge"></i> Professeurs</a></li>
            <li><a th:href="@{/admin/matieres}" class="nav-link active"><i class="bi bi-book"></i> Matières</a></li>
        </ul>
        
        <div class="p-3 border-top border-secondary">
            <form th:action="@{/logout}" method="post" class="m-0">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-outline-danger btn-sm w-100">
                    <i class="bi bi-box-arrow-left"></i> Déconnexion
                </button>
            </form>
        </div>
    </aside>

    <div class="main-wrapper">
        <nav class="top-navbar d-flex align-items-center px-4 justify-content-between">
            <button class="btn btn-sm btn-light d-lg-none" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
            <div class="ms-auto d-flex align-items-center">
                <span class="me-3 text-muted">Bonjour, <strong th:text="${username}">Admin</strong></span>
            </div>
        </nav>

        <div class="container-fluid p-4">
            
            <div class="d-flex justify-content-between align-items-center pb-2 mb-3 border-bottom">
                <h1 class="h2">Gestion des Matières</h1>
            </div>

            <div class="card mb-4 border-0 shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 fw-bold text-primary" id="formTitle"><i class="bi bi-plus-circle"></i> Paramétrage Matière</h5>
                </div>
                <div class="card-body">
                    <form id="createMatiereForm" class="row g-3">
                        <input type="hidden" id="editIdMatiere">

                        <div class="col-md-4">
                            <label class="form-label">Nom de la matière</label>
                            <input name="nom" type="text" class="form-control" id="nom" placeholder="Ex: Algorithmique" required>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Coefficient</label>
                            <input name="coefficient" type="number" class="form-control" id="coefficient" value="1" min="1">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Professeur Responsable</label>
                            <select id="professeurId" class="form-select" required>
                                <option value="" selected disabled>Choisir un enseignant...</option>
                                <option th:each="p : ${professeurs}" 
                                        th:value="${p.idProfesseur}" 
                                        th:text="${p.nom + ' ' + p.prenom}">
                                </option>
                            </select>
                        </div>
                        <div class="col-12 text-end">
                            <button type="button" class="btn btn-light d-none" id="cancelBtn" onclick="resetForm()">Annuler</button>
                            <button type="submit" class="btn btn-primary" id="submitBtn">
                                <i class="bi bi-save"></i> Enregistrer
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div id="alertContainer"></div>

            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 fw-bold text-primary">Liste des Matières</h5>
                    <span class="badge bg-light text-dark border" th:text="${#lists.size(matieres) + ' total'}">0</span>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Matière</th>
                                <th class="text-center">Coef.</th>
                                <th>Enseignant Responsable</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="matieresTableBody">
                            <tr th:each="m : ${matieres}" th:id="'row-' + ${m.idMatiere}">
                                <td th:text="${m.idMatiere}">1</td>
                                <td class="fw-bold matiere-nom" th:text="${m.nom}">Nom</td>
                                <td class="text-center">
                                    <span class="badge bg-secondary rounded-pill matiere-coef" th:text="${m.coefficient}">1</span>
                                </td>
                                <td>
                                    <i class="bi bi-person-workspace text-muted me-2"></i>
                                    <span class="matiere-prof-name" th:text="${m.professeur != null ? m.professeur.nom + ' ' + m.professeur.prenom : 'Non assigné'}"></span>
                                    <input type="hidden" class="matiere-prof-id" th:value="${m.professeur != null ? m.professeur.idProfesseur : ''}">
                                </td>
                                <td class="text-end">
                                    <button class="btn btn-sm btn-outline-secondary" 
                                            th:onclick="'prepareEdit(' + ${m.idMatiere} + ', this)'">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger ms-1" 
                                            th:onclick="'deleteMatiere(' + ${m.idMatiere} + ')'">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');
        
        const form = document.getElementById('createMatiereForm');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const alertContainer = document.getElementById('alertContainer');
        const editIdInput = document.getElementById('editIdMatiere');

        function showAlert(message, type) {
            const wrapper = document.createElement('div');
            wrapper.innerHTML = [
                `<div class="alert alert-${type} alert-dismissible fade show" role="alert">`,
                `   <div>${message}</div>`,
                '   <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>',
                '</div>'
            ].join('');
            alertContainer.innerHTML = '';
            alertContainer.append(wrapper);
        }

        // --- GESTION UNIQUE : AJOUT (POST) OU MODIF (PUT) ---
        form.addEventListener('submit', async function(evt) {
            evt.preventDefault();
            
            const id = editIdInput.value;
            const isEdit = id !== "";
            
            submitBtn.disabled = true;

            const profIdVal = document.getElementById('professeurId').value;
            const payload = {
                nom: document.getElementById('nom').value,
                coefficient: parseInt(document.getElementById('coefficient').value),
                professeur: profIdVal ? { idProfesseur: parseInt(profIdVal) } : null
            };

            // Si c'est une modif, on ajoute l'ID dans le JSON si nécessaire par ton API
            if(isEdit) payload.idMatiere = parseInt(id);

            try {
                const url = isEdit ? `/api/admin/matieres/${id}` : '/api/admin/matieres';
                const method = isEdit ? 'PUT' : 'POST';

                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    showAlert(isEdit ? "Matière modifiée !" : "Matière ajoutée !", "success");
                    setTimeout(() => location.reload(), 1000); 
                } else {
                    const txt = await res.text();
                    showAlert("Erreur : " + (txt || res.status), "danger");
                }
            } catch (err) {
                showAlert("Erreur réseau : " + err.message, "danger");
            } finally {
                submitBtn.disabled = false;
            }
        });

        // --- PRÉPARER LA MODIFICATION (SANS MODAL) ---
        function prepareEdit(id, btn) {
            const row = btn.closest('tr');
            
            // On remplit le formulaire du haut
            editIdInput.value = id;
            document.getElementById('nom').value = row.querySelector('.matiere-nom').innerText;
            document.getElementById('coefficient').value = row.querySelector('.matiere-coef').innerText;
            document.getElementById('professeurId').value = row.querySelector('.matiere-prof-id').value;

            // On change l'apparence du formulaire
            document.getElementById('formTitle').innerHTML = '<i class="bi bi-pencil-square"></i> Modifier la Matière';
            submitBtn.innerHTML = '<i class="bi bi-check-lg"></i> Mettre à jour';
            submitBtn.classList.replace('btn-primary', 'btn-warning');
            cancelBtn.classList.remove('d-none');
            
            // Remonter en haut de page
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- RÉINITIALISER LE FORMULAIRE ---
        function resetForm() {
            form.reset();
            editIdInput.value = "";
            document.getElementById('formTitle').innerHTML = '<i class="bi bi-plus-circle"></i> Paramétrage Matière';
            submitBtn.innerHTML = '<i class="bi bi-save"></i> Enregistrer';
            submitBtn.classList.replace('btn-warning', 'btn-primary');
            cancelBtn.classList.add('d-none');
        }

        // --- SUPPRESSION ---
        async function deleteMatiere(id) {
            if (!confirm("Voulez-vous vraiment supprimer cette matière ?")) return;

            try {
                const res = await fetch(`/api/admin/matieres/${id}`, {
                    method: 'DELETE',
                    headers: { [csrfHeader]: csrfToken }
                });

                if (res.ok) {
                    showAlert("Matière supprimée !", "success");
                    setTimeout(() => location.reload(), 1000);
                } else {
                    const txt = await res.text();
                    showAlert("Erreur lors de la suppression", "danger");
                }
            } catch (err) {
                showAlert("Erreur réseau", "danger");
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('show');
        }
    </script>
</body>
</html>
