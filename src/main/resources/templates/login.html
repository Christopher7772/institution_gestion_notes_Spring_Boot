<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Connexion — MyApp</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- Optionnel: charger un CSS externe placé dans /static/css/login.css -->
  <link th:href="@{/css/login.css}" rel="stylesheet">
  
</head>
<body>
  <main>
    <form class="card" th:action="@{/perform_login}" method="post" novalidate>
      <h2 style="margin:0 0 8px">INSTITUTION ACADEMIQUE</h2>

      <!-- CSRF token injecté par le controller (voir LoginController ci-dessous) -->
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <!-- Affiche message d'erreur si Spring Security redirige ?error -->
      <div th:if="${param.error}" class="error-inline" role="alert">
        Échec de connexion — vérifie ton email et mot de passe.
      </div>
      <div th:if="${param.logout}" class="muted" role="status">Vous êtes déconnecté.</div>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="utilisateur@exemple.com" required autocomplete="username" />

      <label for="password" style="margin-top:10px">Mot de passe</label>
      <input id="password" name="password" type="password" placeholder="••••••••" required autocomplete="current-password" />

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
        <label style="font-size:13px;display:flex;align-items:center;gap:8px">
          <input type="checkbox" id="remember" name="remember"> Se souvenir
        </label>
        <a th:href="@{/forgot-password}" style="color:rgba(255,255,255,0.8);font-size:13px;text-decoration:underline">Mot de passe oublié ?</a>
      </div>

      <button type="submit" class="btn" id="submitBtn">
        Se connecter
      </button>

      <div class="muted">Pas encore de compte ? <a th:href="@{/register}" style="color:#bff0e9;text-decoration:underline">S'inscrire</a></div>
    </form>
  </main>

  <!-- External JS -->
  <script th:src="@{/js/login.js}" defer></script>

  <!-- Petit JS inline (optionnel) : garde pour améliorer UX -->
  <script>
    // Basic client validation + UX spinner (keeps POST native)
    document.addEventListener('DOMContentLoaded', function(){
      const form = document.querySelector('form.card');
      const submitBtn = document.getElementById('submitBtn');
      form.addEventListener('submit', function(e){
        const email = document.getElementById('email').value.trim();
        const pw = document.getElementById('password').value;
        if(!email || !pw){ e.preventDefault(); alert('Email et mot de passe requis'); return; }
        submitBtn.disabled = true;
        submitBtn.textContent = 'Connexion...';
      });
    });
  </script>
</body>
</html>
