# =========================================================
# CONFIGURATION DE L'APPLICATION
# =========================================================
spring.application.name=institution_gestion_notes

# --- BASE DE DONNÉES (HYBRIDE LOCAL/PRODUCTION) ---
# Si les variables ${DB_HOST}, etc. sont absentes (sur ton PC), 
# Spring utilise les valeurs après les deux-points (ton MySQL local).
# Si elles sont présentes (sur Render), Spring utilise Aiven.

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:institution_gestion_notes}?useSSL=${USE_SSL:false}&serverTimezone=UTC&trustServerCertificate=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:49358485}

# --- JPA / HIBERNATE ---
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# --- SERVEUR (DYNAMIQUE POUR RENDER) ---
# Render exige d'utiliser la variable d'environnement PORT. 
# En local, ton application utilisera le port 8080 par défaut.
server.port=${PORT:8080}

# --- GESTION DES ERREURS ---
server.error.include-message=always

# --- LOGS ---
# INFO est suffisant pour la production, évite de surcharger les fichiers logs
logging.level.org.springframework=INFO
logging.level.institution_gestion_notes=INFO
